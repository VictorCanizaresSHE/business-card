<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Heritage - Victor Canizares</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 3D 视角设置 */
        .card-container {
            width: 380px;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        /* 名片主体 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        /* 翻转效果 */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 正反面通用样式 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            backface-visibility: hidden;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #332d20;
        }

        /* 正面样式 */
        .card-front {
            align-items: flex-start;
        }

        /* Logo 专属排版结构 */
        .logo-title {
            display: flex;
            flex-direction: column;
            color: #332d20;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.2px;
            line-height: 1;
        }

        /* 上排 SPANISH：向右平移14px，使 S 的起点对齐破折号中点，P 的起点对齐 H */
        .logo-title .line-1 {
            margin-left: 14px;
        }

        /* 下排：破折号 + HERITAGE */
        .logo-title .line-2 {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        /* Logo 破折号：长度 22px */
        .logo-dash {
            width: 22px;
            height: 5px;
            background-color: #332d20;
            display: inline-block;
            flex-shrink: 0;
        }

        .card-front .tagline {
            font-size: 13px;
            align-self: flex-end;
            font-weight: 500;
        }

        /* 背面样式 */
        .card-back {
            transform: rotateY(180deg);
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 12px;
            align-items: center;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .slogan {
            font-size: 18px;
            line-height: 1.2;
        }

        .slogan strong {
            font-weight: 800;
        }

        .slogan em {
            font-style: italic;
            font-weight: 600;
        }

        .right-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            height: 100%;
            text-align: right;
        }

        .user-info .name {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.1;
        }

        .user-info .title {
            font-size: 15px;
            font-weight: 600;
            margin-top: 2px;
        }

        .contact-info {
            font-size: 11px;
            line-height: 1.35;
            font-weight: 500;
        }

        .contact-info a {
            color: inherit;
            text-decoration: none;
        }

        .badge {
            font-size: 14px;
            font-weight: 800;
            margin-top: 4px;
        }

        .badge span {
            font-weight: 400;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <!-- 正面 -->
            <div class="card-face card-front">
                <div class="logo-title">
                    <span class="line-1">SPANISH</span>
                    <div class="line-2">
                        <span class="logo-dash"></span>
                        <span>HERITAGE</span>
                    </div>
                </div>
                <div class="tagline">Destination Management Company</div>
            </div>

            <!-- 背面 -->
            <div class="card-face card-back">
                <div class="left-col">
                    <div class="slogan">
                        Your <strong>Trusted</strong><br>
                        Partner in<br>
                        <em>Spain.</em>
                    </div>
                </div>

                <div class="right-col">
                    <div class="user-info">
                        <div class="name">Victor Canizares</div>
                        <div class="title">CEO</div>
                    </div>

                    <div class="contact-info">
                        <div><a href="mailto:vcanizares@spheritage.com">vcanizares@spheritage.com</a></div>
                        <div><a href="tel:+34933221050">+34 933 221 050</a></div>
                        <div><a href="tel:+34629309941">+34 629 309 941</a></div>
                        <div class="badge">cis <span>|</span> citp</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function flipCard() {
            document.getElementById('card').classList.toggle('flipped');
        }
    </script>

</body>
</html>
